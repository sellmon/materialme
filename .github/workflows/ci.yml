name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck components
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Build CLI
        run: pnpm build:cli

      - name: Registry drift check
        run: |
          pnpm build:registry
          git diff --exit-code registry.json || (
            echo "registry.json is out of date. Run pnpm build:registry and commit."
            exit 1
          )

      - name: Build preview
        run: |
          rm -rf preview/.next
          pnpm --filter preview build
